services:
  # 1. Сервіс Бази Даних Cassandra
  cassandra:
    image: cassandra:4.1
    container_name: cassandra-db
    ports:
      - "9042:9042" # Відкриваємо порт для підключення ззовні (напр. cqlsh)
    healthcheck:
      # Перевірка, чи Cassandra готова приймати запити
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # 2. Сервіс Python-додатку
  python-app:
    build:
      context: . # Вказує Docker зібрати образ з Dockerfile у цій же папці
      dockerfile: Dockerfile
    container_name: python-bess-app
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_MAX_RETRIES=10
      - CASSANDRA_RETRY_DELAY_SEC=2
    # Цей сервіс почне працювати ТІЛЬКИ після того,
    # як сервіс 'cassandra' пройде свою перевірку 'healthcheck'
    depends_on:
      cassandra:
        condition: service_healthy

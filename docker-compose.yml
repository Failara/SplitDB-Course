services:
  # 1. Сервіс Бази Даних Cassandra
  cassandra:
    image: cassandra:latest
    container_name: cassandra-db
    ports:
      - "9042:9042" # Відкриваємо порт для підключення ззовні (напр. cqlsh)
    environment:
      - CASSANDRA_START_RPC=true
    healthcheck:
      # Перевірка, чи Cassandra готова приймати запити
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # 2. Сервіс Python-додатку
  python-app:
    build: . # Вказує Docker зібрати образ з Dockerfile у цій же папці
    container_name: python-bess-app
    # Цей сервіс почне працювати ТІЛЬКИ після того,
    # як сервіс 'cassandra' пройде свою перевірку 'healthcheck'
    depends_on:
      cassandra:
        condition: service_healthy
